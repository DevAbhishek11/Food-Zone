name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FoodZoneServer
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: FoodZoneServer/vendor
          key: composer-${{ hashFiles('FoodZoneServer/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
        # Tests run on in-memory SQLite (phpunit.xml); rate limiting + external
        # services (Redis/Meilisearch/Reverb/payments/push) are disabled there.

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foodzoneweb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: foodzoneweb/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FoodZoneApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FoodZoneApp/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
